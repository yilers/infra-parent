<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>第三方账号授权</title>
  </head>
  <body>
    <p>正在完成第三方账号授权，请稍候……</p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const loginFlow = params.get('state')?.startsWith('login_');
      const callbackPath = loginFlow ? '/auth/login' : '/profile';
      if (!loginFlow) {
        params.set('setting', 'thirdAuth');
      }
      const target = `/#${callbackPath}?${params.toString()}`;
      window.location.replace(target);
    </script>
  </body>
</html>
