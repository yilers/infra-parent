<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>第三方账号授权</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const loginFlow = params.get('state')?.startsWith('login_');
      const callbackPath = loginFlow ? '/auth/login' : '/profile';
      if (loginFlow) {
        // 恢复外部认证前的登录目标，继续完成业务应用的 SSO 授权。
        const redirect = sessionStorage.getItem('infra-third-auth-login-redirect');
        if (redirect) {
          params.set('redirect', redirect);
        }
      } else {
        params.set('setting', 'thirdAuth');
      }
      const target = `/#${callbackPath}?${params.toString()}`;
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
