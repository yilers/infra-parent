spring.application.name=infra

# 统一启动器启用请假示例；仅依赖通用flow-core的其他宿主默认不加载此业务。
flow.leave.enabled=true
flow.leave.flow-code=leave
spring.profiles.active=@profiles.active@

server.port=9000
server.shutdown=graceful
spring.threads.virtual.enabled=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

mybatis-plus.global-config.db-config.id-type=assign_id
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.shrink-whitespaces-in-sql=true

logging.level.root=info
logging.level.io.github.yilers=debug
# 第三方平台密钥明文落库时，禁止MyBatis输出该Mapper的SQL参数。
logging.level.io.github.yilers.upm.mapper.ThirdAuthConfigMapper=info
logging.file.path=./log
logging.file.name=${logging.file.path}/${spring.application.name}/app.log

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

permission.column.table=upm_log,upm_user

# token 名称（同时也是 cookie 名称）
sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.is-read-cookie=false
sa-token.is-read-body=false
# token 有效期（单位：秒） 默认30天，-1 代表永久有效
sa-token.timeout=172800
sa-token.auto-renew=true
# token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
sa-token.active-timeout=-1
# 动态设置活跃时间
sa-token.dynamic-active-timeout=false
# 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
sa-token.is-concurrent=true
# 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
sa-token.is-share=true
# token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
sa-token.token-style=simple-uuid
# 是否输出操作日志
sa-token.is-log=true

upm.application-code=infra
# namespace打散密钥的加密主密钥，必须独立配置并备份，不与UPM或SSO共用。
shortlink.crypto.master-key=${SHORTLINK_MASTER_KEY:7Y4BDpEbbrozrk5W5fef9lPAX27l4EVgH2XyemTaqzU=}
# https://emn178.github.io/online-tools/sha256.html
# 系统调用密钥加密主密钥：32字节随机值，经Base64编码后通过环境变量提供。
upm.api.secret-key=${UPM_API_SECRET_KEY:7Y4BDpEbbrozrk5W5fef9lPAX27l4EVgH2XyemTaqzU=}
# key -> sha256 -> base64
upm.sso.secret-key=${UPM_SSO_SECRET_KEY:7Y4BDpEbbrozrk5W5fef9lPAX27l4EVgH2XyemTaqzU=}
upm.sso.ticket-timeout=60

jetcache.statIntervalMinutes=10
jetcache.areaInCacheName=false
jetcache.remote.default.type=redisson
jetcache.remote.default.redissonClient=jetCacheRedisClient
jetcache.remote.default.keyConvertor=jackson
jetcache.remote.default.broadcastChannel=${spring.application.name}
jetcache.remote.default.keyPrefix=jetcache:
jetcache.remote.default.valueEncoder=java
jetcache.remote.default.valueDecoder=java
jetcache.remote.default.defaultExpireInMillis=10000

## jetcache 2.8.x后添加
jetcache.decodeFilterAllowPatterns=io.github.yilers.,com.baomidou.

## swagger配置
knife4j.basic.enable=true
knife4j.basic.include=/admin/*,/plumelog/*,/bootui/*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=upm
springdoc.group-configs[0].open-api.info.title=upm
springdoc.group-configs[0].open-api.info.version=v1.0.0
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=io.github.yilers.upm.controller

springdoc.group-configs[1].group=flow
springdoc.group-configs[1].open-api.info.title=flow
springdoc.group-configs[1].open-api.info.version=v1.0.0
springdoc.group-configs[1].paths-to-match=/**
springdoc.group-configs[1].packages-to-scan=io.github.yilers.flow.controller

springdoc.group-configs[2].group=shortlink
springdoc.group-configs[2].open-api.info.title=shortlink
springdoc.group-configs[2].open-api.info.version=v1.0.0
springdoc.group-configs[2].paths-to-match=/**
springdoc.group-configs[2].packages-to-scan=io.github.yilers.shortlink.controller

knife4j.setting.language=ZH_CN
knife4j.documents[0].group=2.X版本
knife4j.documents[0].name=接口签名
knife4j.documents[0].locations=classpath:markdown/*
knife4j.setting.enable-swagger-models=true
knife4j.setting.enable-document-manage=true
knife4j.setting.swagger-model-name=model
knife4j.setting.enable-version=true
knife4j.setting.enable-reload-cache-parameter=true
knife4j.setting.enable-after-script=true
knife4j.setting.enable-filter-multipart-api-method-type=POST
knife4j.setting.enable-filter-multipart-apis=false
knife4j.setting.enable-request-cache=true
knife4j.setting.enable-host=false
#knife4j.setting.enable-host-text=192.168.0.193:8000
knife4j.setting.enable-home-custom=true
#knife4j.setting.home-custom-path=classpath:markdown/README.md
knife4j.setting.enable-search=true
knife4j.setting.enable-footer=true
knife4j.setting.enable-footer-custom=true
knife4j.setting.footer-custom-content=Apache License 2.0 | Copyright 2026-[yilers](https://github.com/yilers)
knife4j.setting.enable-dynamic-parameter=true
knife4j.setting.enable-debug=true
knife4j.setting.enable-open-api=false
knife4j.setting.enable-group=true
