<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>链接走丢了</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      color: #25223b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at 18% 15%, #e5dcff 0, transparent 38%),
        radial-gradient(ellipse at 83% 82%, #e1e8ff 0, transparent 35%), #f8f7fd;
    }
    .card {
      position: relative;
      width: min(100%, 920px);
      min-height: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 16px;
      padding: 54px 64px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255,255,255,.76);
      box-shadow: 0 26px 90px rgba(83,65,141,.12);
    }
    .eyebrow { color: #8d7bd2; font-size: 12px; font-weight: 700; letter-spacing: .2em; }
    .badge { display: inline-block; padding: 7px 12px; border-radius: 999px; color: #7659c8; background: #f0eaff; font-size: 12px; font-weight: 600; }
    h1 { margin: 22px 0 14px; font-size: clamp(30px, 4vw, 42px); line-height: 1.25; letter-spacing: -.04em; }
    .copy { max-width: 330px; margin: 0; color: #85819b; font-size: 15px; line-height: 1.9; }
    .hint { display: flex; align-items: flex-start; gap: 10px; margin-top: 28px; color: #9792aa; font-size: 13px; line-height: 1.7; }
    .hint span:first-child { flex: none; color: #a995ed; font-size: 17px; line-height: 1.3; }
    .art { position: relative; display: grid; place-items: center; min-width: 0; }
    .art svg { width: min(100%, 360px); height: auto; overflow: visible; }
    .float { animation: float 4s ease-in-out infinite; transform-origin: center; }
    .spark { animation: twinkle 2.8s ease-in-out infinite alternate; }
    .spark-two { animation-delay: 1.1s; }
    .footer { position: absolute; bottom: 24px; left: 64px; color: #c1bdd0; font-size: 11px; letter-spacing: .08em; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes twinkle { from { opacity: .35; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 680px) {
      .card { grid-template-columns: 1fr; min-height: auto; gap: 0; padding: 44px 30px 60px; text-align: center; }
      .content { order: 2; }
      .art { order: 1; }
      .art svg { width: min(72%, 260px); }
      .copy { margin: 0 auto; }
      .hint { justify-content: center; }
      .footer { right: 0; bottom: 22px; left: 0; }
      h1 { margin-top: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { .float, .spark { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <section class="content">
      <span class="badge">404 · NOT FOUND</span>
      <h1>哎呀，链接走丢了</h1>
      <p class="copy">这条链接可能已过期、失效，或地址有误。<br>别着急，可以联系分享者重新获取。</p>
      <div class="hint"><span aria-hidden="true">✦</span><span>好奇心没有走丢，好内容会再相遇。</span></div>
    </section>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 360 330" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="orbit" x1="44" y1="48" x2="308" y2="284" gradientUnits="userSpaceOnUse"><stop stop-color="#E4DAFF"/><stop offset="1" stop-color="#EAF0FF"/></linearGradient>
          <linearGradient id="planet" x1="94" y1="64" x2="273" y2="255" gradientUnits="userSpaceOnUse"><stop stop-color="#BAA9FB"/><stop offset="1" stop-color="#7B70D9"/></linearGradient>
          <linearGradient id="paper" x1="118" y1="98" x2="242" y2="246" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#F0ECFF"/></linearGradient>
          <filter id="shadow" x="62" y="60" width="240" height="228" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="12"/></filter>
        </defs>
        <circle cx="181" cy="161" r="125" fill="url(#orbit)" opacity=".7"/>
        <ellipse cx="181" cy="262" rx="95" ry="15" fill="#AFA4D7" opacity=".19" filter="url(#shadow)"/>
        <g class="float">
          <circle cx="181" cy="158" r="93" fill="url(#planet)"/>
          <path d="M95 174c-34 22-50 40-44 51 9 16 73 6 143-22 70-29 120-64 113-80-3-7-17-9-38-6" stroke="#D8CFFF" stroke-width="9" stroke-linecap="round"/>
          <rect x="124" y="105" width="112" height="126" rx="25" transform="rotate(-8 124 105)" fill="url(#paper)"/>
          <path d="M157 143l17-2m23-3 17-2" stroke="#8B7CCD" stroke-width="6" stroke-linecap="round"/>
          <path d="M174 177c5-7 13-8 20-3" stroke="#8B7CCD" stroke-width="5" stroke-linecap="round"/>
          <circle cx="148" cy="165" r="7" fill="#EDB7D2" opacity=".65"/>
          <circle cx="213" cy="156" r="7" fill="#EDB7D2" opacity=".65"/>
          <path d="M212 96l7-19m0 0 14 9m-14-9-13-8" stroke="#9482E1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="spark" fill="#A38FEA"><path d="M71 78l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/><circle cx="286" cy="207" r="4"/></g>
        <g class="spark spark-two" fill="#C6B7F7"><path d="M293 48l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><circle cx="68" cy="196" r="3"/></g>
      </svg>
    </div>
    <div class="footer">TAKE A LITTLE DETOUR · 404</div>
  </main>
</body>
</html>
